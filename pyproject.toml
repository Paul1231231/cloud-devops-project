[project]
name = "cloud-devops-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "paul1231231", email = "pokpokli557@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.5",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.14.3",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
cloud-devops-project = "cloud_devops_project:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
